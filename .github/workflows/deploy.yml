name: CI/CD

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  test-and-validate:
    name: Testes e validação de migrações
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (sgmu-next)
        working-directory: ./sgmu-next
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (Vitest)
        run: pnpm test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Validate database migrations against Postgres service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          supabase db push --db-url "$DATABASE_URL"

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    needs: [ test-and-validate ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: true

      - name: Build (Vite - raiz)
        run: pnpm build

      - name: Upload artifact (Vite)
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: dist

      - name: Build (Next - sgmu-next)
        working-directory: ./sgmu-next
        run: pnpm build

      - name: Upload artifact (Next)
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: |
            sgmu-next/.next

  deploy:
    name: Deploy condicional
    runs-on: ubuntu-latest
    needs: [ build ]
    if: >-
      ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact (Vite)
        uses: actions/download-artifact@v4
        with:
          name: vite-dist
          path: dist

      - name: Deploy para GitHub Pages (opcional)
        if: ${{ startsWith(secrets.DEPLOY_TARGET || '', 'gh-pages') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Deploy provider externo (placeholder)
        if: ${{ startsWith(secrets.DEPLOY_TARGET || '', 'external') }}
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Executar CLI do provedor com token" && exit 0

